configuration:
  sms_provider:
    name: SMS provider
    description: "twilio = send with your Twilio account; homeassistant = use a notify service you already have in Home Assistant (e.g. a GSM modem or the Twilio SMS integration)."
  twilio_account_sid:
    name: Twilio account SID
  twilio_auth_token:
    name: Twilio auth token
  twilio_from:
    name: Twilio sender
    description: Your Twilio phone number (+1555...) or Messaging Service SID (MG...).
  notify_service:
    name: Home Assistant notify service
    description: "Used when provider is homeassistant, e.g. notify.sms. It is called with the coworker's phone number as target."
  payee:
    name: Pay to
  payment_details:
    name: Payment details
    description: How to pay, e.g. a bank account or phone number for transfers.
  currency:
    name: Currency
  message_template:
    name: Message
    description: "Placeholders: {name}, {amount}, {payee}, {payment_details}. Under 160 characters without emoji fits in one SMS."
  min_amount:
    name: Minimum amount
    description: People who owe less than this are not texted.
  schedule_enabled:
    name: Automatic reminders
  reminder_days:
    name: Reminder days
  reminder_time:
    name: Reminder time
    description: 24-hour HH:MM in Home Assistant's time zone.
