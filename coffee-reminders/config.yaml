name: Coffee Reminders
version: "0.3.0"
slug: coffee_reminders
description: Text coworkers who owe money to the coffee fund
url: https://github.com/Matwilko1/Matwilko1
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:coffee
panel_title: Coffee
homeassistant_api: true
uart: true
usb: true
options:
  sms_provider: twilio
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_from: ""
  notify_service: ""
  modem_pin: ""
  modem_baud: 115200
  payee: Coffee Fund
  payment_details: ""
  currency: PLN
  message_template: "Hi {name}! Friendly coffee reminder: you owe {amount}. Please pay {payee} ({payment_details}). Thanks!"
  min_amount: 0.01
  schedule_enabled: true
  reminder_days:
    - mon
  reminder_time: "09:00"
schema:
  sms_provider: list(modem|twilio|homeassistant)
  twilio_account_sid: str?
  twilio_auth_token: password?
  twilio_from: str?
  notify_service: str?
  modem_device: device(subsystem=tty)?
  modem_pin: password?
  modem_baud: int?
  payee: str
  payment_details: str?
  currency: str
  message_template: str
  min_amount: float(0,)
  schedule_enabled: bool
  reminder_days:
    - list(mon|tue|wed|thu|fri|sat|sun)
  reminder_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
